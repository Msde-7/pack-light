<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprite gallery</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4efe6;
        color: #1f1a24;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 22px;
      }
      h2 {
        margin: 32px 0 12px;
        font-size: 16px;
        text-transform: capitalize;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      canvas {
        image-rendering: pixelated;
      }
      figcaption {
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Pack Light sprites</h1>
    <p>Every sprite at 6x.</p>
    <main id="gallery"></main>
    <script src="gallery.js"></script>
  </body>
</html>
